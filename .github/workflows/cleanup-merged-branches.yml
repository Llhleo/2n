name: Clean merged optimization branches
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
    paths: [".github/workflows/cleanup-merged-branches.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'maintenance/release-and-preview'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only reviewed branches already included in main
        uses: actions/github-script@v8
        with:
          script: |
            const candidates = [{"branch":"optimize/loading-and-ci","sha":"77e20f471f645595b7d2a9bab11570ddf834e45d"},{"branch":"optimize/navigation-and-lifecycle","sha":"96d9c977c55dbfc6d1df9bd26010bc51237bcb0e"},{"branch":"optimize/preview-publishing","sha":"abe737b05ea53ba0565c8add2dc97473032f7f23"},{"branch":"optimize/runtime-and-content","sha":"0c2c68a6a9f3a2d839ee5cddfe2b8d3cae3bb205"},{"branch":"work/v1.0-release","sha":"4da1b3e43c331349120253375019100872f127a4"}];
            const { owner, repo } = context.repo;
            for (const candidate of candidates) {
              let current;
              try {
                current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + candidate.branch });
              } catch (error) {
                if (error.status === 404) { core.info('Already absent: ' + candidate.branch); continue; }
                throw error;
              }
              if (current.data.object.sha !== candidate.sha) {
                throw new Error('Branch changed since review: ' + candidate.branch);
              }
              const comparison = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: candidate.sha + '...main' });
              if (!['ahead', 'identical'].includes(comparison.data.status) || comparison.data.behind_by !== 0) {
                throw new Error('Branch contains unmerged work: ' + candidate.branch);
              }
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + candidate.branch });
              core.info('Deleted merged branch: ' + candidate.branch);
              await core.summary.addRaw('Deleted merged branch: ' + candidate.branch + '\n').write();
            }
