name: Check site and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source site
        run: npm run check
      - name: Test motion, liquid, loading and content
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Prepare lossless optimized site
        run: python tools/optimize-assets.py
      - name: Check deployment assets
        run: npm run check
        env:
          SITE_DIR: _site
      - name: Upload checked site
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout previous implementation for comparison
        uses: actions/checkout@v4
        with:
          ref: 0c2c68a6a9f3a2d839ee5cddfe2b8d3cae3bb205
          path: _baseline
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download optimized site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check desktop and touch behavior
        run: npm run test:browser
        env:
          SITE_DIR: _site
          BASELINE_URL: http://127.0.0.1:4174
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download checked site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
