name: Check site and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate management content from JSON
        run: npm run content
      - name: Check source site
        run: npm run check
      - name: Test motion, liquid, loading and content
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Prepare lossless optimized site
        run: python tools/optimize-assets.py
      - name: Check deployment assets
        run: npm run check
        env:
          SITE_DIR: _site
      - name: Upload checked site
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout previous implementation for comparison
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: _baseline
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download optimized site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Check desktop and touch behavior
        run: npm run test:browser
        env:
          SITE_DIR: _site
          BASELINE_URL: http://127.0.0.1:4174
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  deploy:
    timeout-minutes: 15
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Download checked site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published production assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tools/verify-deployment.py _site "$PAGE_URL"

  preview:
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')
    needs: [check, browser]
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: 2n-preview
      url: ${{ steps.deployment.outputs.page_url }}preview/
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification tools
        uses: actions/checkout@v4
      - name: Checkout unchanged production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _production
      - name: Download checked preview
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _preview
      - name: Setup production image encoder
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Prepare current production assets
        working-directory: _production
        run: |
          npm run content
          python tools/optimize-assets.py
      - name: Assemble production and isolated preview
        run: |
          mkdir -p _pages/preview
          cp -a _production/_site/. _pages/
          cp -a _preview/. _pages/preview/
          touch _pages/.nojekyll
          cmp _production/_site/index.html _pages/index.html
          cmp _preview/index.html _pages/preview/index.html
      - name: Ensure production source is still current
        working-directory: _production
        run: |
          current_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_sha" = "$remote_sha"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload production with preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python tools/verify-deployment.py _production/_site "$PAGE_URL"
          python tools/verify-deployment.py _preview "${PAGE_URL%/}/preview/"

  cleanup:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove merged optimization and maintenance branches
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            for (const branch of branches) {
              if (branch.protected || !/^(optimize|maintenance|fix)\//.test(branch.name)) continue;
              const result = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: branch.commit.sha + '...' + context.sha });
              if (!['ahead', 'identical'].includes(result.data.status) || result.data.behind_by !== 0) continue;
              const ref = 'heads/' + branch.name;
              let current;
              try {
                current = await github.rest.git.getRef({ owner, repo, ref });
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              if (current.data.object.sha !== branch.commit.sha) {
                core.info('Preserved changed branch: ' + branch.name);
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref });
              core.info('Deleted merged branch: ' + branch.name);
            }
