name: Check site and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source site
        run: npm run check
      - name: Test motion, liquid, loading and content
        run: npm test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Prepare lossless optimized site
        run: python tools/optimize-assets.py
      - name: Check deployment assets
        run: npm run check
        env:
          SITE_DIR: _site
      - name: Upload checked site
        uses: actions/upload-artifact@v4
        with:
          name: checked-site
          path: _site
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout previous implementation for comparison
        uses: actions/checkout@v4
        with:
          ref: 0c2c68a6a9f3a2d839ee5cddfe2b8d3cae3bb205
          path: _baseline
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download optimized site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Check desktop and touch behavior
        run: npm run test:browser
        env:
          SITE_DIR: _site
          BASELINE_URL: http://127.0.0.1:4174
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

  deploy:
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, browser]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download checked site
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'maintenance/release-and-preview'
    needs: [check, browser]
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: 2n-preview
      url: ${{ steps.deployment.outputs.page_url }}preview/
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout unchanged production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: _production
      - name: Download checked preview
        uses: actions/download-artifact@v4
        with:
          name: checked-site
          path: _preview
      - name: Setup production image encoder
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Prepare current production assets
        working-directory: _production
        run: python tools/optimize-assets.py
      - name: Assemble production and isolated preview
        run: |
          mkdir -p _pages/preview
          cp -a _production/_site/. _pages/
          cp -a _preview/. _pages/preview/
          touch _pages/.nojekyll
          cmp _production/_site/index.html _pages/index.html
          cmp _preview/index.html _pages/preview/index.html
      - name: Ensure production source is still current
        working-directory: _production
        run: |
          current_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$current_sha" = "$remote_sha"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload production with preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, pathlib, time, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          for route, source in [("", "_production/_site/index.html"), ("preview/", "_preview/index.html"), ("preview/app.js", "_preview/app.js")]:
              expected = pathlib.Path(source).read_bytes()
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(base + route + "?verify=" + str(time.time_ns()), timeout=20) as response:
                          actual = response.read()
                      if actual == expected:
                          print("Verified:", base + route)
                          break
                  except Exception as error:
                      print(type(error).__name__, str(error))
                  time.sleep(5)
              else:
                  raise SystemExit("Published content did not match: " + route)
          PY
