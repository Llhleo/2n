<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><title>Jev 决策机</title><style>
:root{color-scheme:light dark;--bg:#f5f5f2;--card:#fff;--ink:#182322;--muted:#60706c;--line:#d9e0db;--accent:#087b69;--soft:#e6f3ef;--danger:#9c4239}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:760px;margin:auto;padding:26px 16px 100px}.eyebrow{font-size:12px;letter-spacing:.15em;font-weight:750;color:var(--accent)}h1{font-size:clamp(32px,8vw,48px);letter-spacing:-.055em;margin:8px 0}p{color:var(--muted)}.intro{margin:0 0 26px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;background:var(--soft);border-radius:16px;margin-bottom:18px}.tabs button{border:0;background:transparent;border-radius:12px;color:var(--muted);font-weight:700;min-height:52px;font-size:15px}.tabs button[aria-selected=true]{background:var(--card);color:var(--accent);box-shadow:0 2px 10px #122c2017}.panel,.result{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 8px 28px #122c2009}h2{font-size:22px;margin:0 0 6px;letter-spacing:-.03em}.hint{font-size:13px;margin:0 0 20px}.field-status{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}label{font-size:14px;font-weight:700;display:block;margin:17px 0 7px}input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:13px 14px;outline:none;min-height:50px}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.item{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.item header{display:flex;align-items:center;justify-content:space-between;font-weight:700}.item label{margin-top:10px}.small,.add{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:11px;padding:8px 12px;font:inherit;font-weight:700}.add{width:100%;min-height:48px}.small:disabled,.add:disabled{opacity:.45}.submit{width:100%;min-height:58px;border:0;border-radius:15px;background:var(--accent);color:white;font:inherit;font-weight:800;font-size:17px;margin-top:20px}.submit:disabled{opacity:.55}.error{color:var(--danger);font-weight:650;white-space:pre-wrap}.hidden{display:none!important}.result .value{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.04em;color:var(--accent);word-break:break-word}.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:7px 0 18px}.bar span{display:block;height:100%;background:var(--accent);border-radius:99px}.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.row span:first-child{overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.metric{border:1px solid var(--line);border-radius:13px;padding:12px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:14px;border-radius:12px;font-size:12px}footer{font-size:12px;color:var(--muted);margin:20px 4px}@media(prefers-color-scheme:dark){:root{--bg:#101917;--card:#1b2724;--ink:#e9f1ed;--muted:#abbdb5;--line:#34453e;--accent:#6cd8bb;--soft:#263c34;--danger:#ffaaa0}}@media(max-width:400px){.panel,.result{padding:18px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="eyebrow">JEV / DECISION TOOL</div><h1>把判断变得清楚。</h1><p class="intro">Jev 不是聊天模型，而是概率决策模型。填写情况，查看各结果的概率与信心。</p><section class="panel" id="login"><h2>解锁决策机</h2><p class="hint">输入访问口令后即可使用。口令不会保存到网页代码中。</p><form id="login-form"><label for="access">访问口令</label><input id="access" type="password" autocomplete="current-password" required><button class="submit" type="submit">解锁</button><p class="error hidden" id="login-error" role="alert"></p></form></section><div id="workspace" class="hidden"><div class="tabs" role="tablist" aria-label="决策模式"><button role="tab" data-mode="choice" aria-selected="true">Choice<br>多选一</button><button role="tab" data-mode="noul" aria-selected="false">Noul<br>判断</button><button role="tab" data-mode="score" aria-selected="false">Score<br>评分</button></div><section class="panel"><h2 id="heading">多选一决策</h2><p class="hint" id="hint">列出可选方案和各自适用条件。</p><form id="form"><div id="fields"></div><button class="submit" id="submit" type="submit">开始判断</button><p class="error hidden" id="error" role="alert"></p></form></section><section class="result hidden" id="result" aria-live="polite"><div class="eyebrow">本次结果</div><h2>主结论</h2><div class="value" id="conclusion"></div><div id="probabilities"></div><div class="metrics" id="metrics"></div><p class="hint" id="estimate"></p><details><summary>查看原始 JSON</summary><button class="small" type="button" id="copy">复制 JSON</button><pre id="raw"></pre></details></section></div><footer>概率用于辅助判断；提交的文字会发送到 Jev 服务端处理。请勿填写密码或敏感身份信息。</footer></main><script>
const fields=document.getElementById('fields'),form=document.getElementById('form'),result=document.getElementById('result'),err=document.getElementById('error');let mode='choice',busy=false,lastRaw='';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(label,name,placeholder='',long=true,required=false)=>`<label for="${name}">${label} <span class="field-status">${required?'必填':'选填'}</span></label>${long?`<textarea id="${name}" name="${name}" maxlength="1600" placeholder="${placeholder}" ${required?'required':''}></textarea>`:`<input id="${name}" name="${name}" maxlength="140" placeholder="${placeholder}" ${required?'required':''}>`}`;
const config={choice:{heading:'多选一决策',hint:'列出可选方案和各自适用条件。',html:()=>field('你要决定什么？','question','例如：周末去哪里？',false,true)+field('背景情况','context','预算、时间、偏好等')+'<div id="items"></div><button type="button" class="add" id="add">＋ 增加选项</button>',min:2,max:8,word:'选项',item:i=>`<div class="item"><header><span>选项 ${i+1}</span><button type="button" class="small remove">删除</button></header>${field('选项名称','name','例如：去郊外',false,true)}${field('什么时候更合适 / 判断标准','criteria','例如：天气好、时间充足时')}</div>`},noul:{heading:'判断命题',hint:'把支持和反对的证据分别写清楚。',html:()=>field('你想判断什么？','question','例如：明天适合户外活动吗？',false,true)+field('背景','context')+field('支持该判断的证据','support')+field('反对该判断的证据','against')+field('其他不确定因素','uncertainty')},score:{heading:'评分 / 分级',hint:'创建从低到高的评分档位，每档说明含义。',html:()=>field('你要评价什么？','question','例如：这套方案的可行性',false,true)+field('背景','context')+field('评价依据','criteria')+'<div id="items"></div><button type="button" class="add" id="add">＋ 增加档位</button>',min:3,max:10,word:'档位',item:i=>`<div class="item"><header><span>档位 ${i+1}</span><button type="button" class="small remove">删除</button></header>${field('名称','name','例如：良好',false,true)}${field('含义','meaning','例如：满足主要条件',true,true)}</div>`}};
function add(name='',detail=''){const cfg=config[mode],box=document.getElementById('items');if(!box||box.children.length>=cfg.max)return;const wrap=document.createElement('div');wrap.innerHTML=cfg.item(box.children.length);let item=wrap.firstElementChild;box.append(item);item.querySelector('[name=name]').value=name;item.querySelector(`[name=${mode==='choice'?'criteria':'meaning'}]`).value=detail;item.querySelector('.remove').onclick=()=>{item.remove();renumber()};renumber()}function renumber(){const cfg=config[mode],box=document.getElementById('items');if(!box)return;[...box.children].forEach((e,i)=>e.querySelector('header span').textContent=`${cfg.word} ${i+1}`);document.getElementById('add').disabled=box.children.length>=cfg.max;box.querySelectorAll('.remove').forEach(b=>b.disabled=box.children.length<=cfg.min)}function switchMode(m){mode=m;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));const cfg=config[m];document.getElementById('heading').textContent=cfg.heading;document.getElementById('hint').textContent=cfg.hint;fields.innerHTML=cfg.html();result.classList.add('hidden');err.classList.add('hidden');if(cfg.item){document.getElementById('add').onclick=()=>add();for(let i=0;i<cfg.min;i++)add(m==='score'?['很差','一般','良好'][i]:'','')}}document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{if(!busy)switchMode(b.dataset.mode)});switchMode(mode);
const text=(el,n)=>el.querySelector(`[name=${n}]`)?.value.trim()||'';function pct(v){if(v===null||v===undefined)return null;const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,n<=1?n*100:n)):null}function metric(label,value){return `<div class="metric"><small>${esc(label)}</small><strong>${esc(value??'暂未提供')}</strong></div>`}function display(data){lastRaw=JSON.stringify(data.raw??data,null,2);document.getElementById('raw').textContent=lastRaw;const r=data.result||{};document.getElementById('conclusion').textContent=r.choice??r.label??(r.score!=null?String(r.score):null)??r.conclusion??'暂无主结论';let ps=r.probabilities??r.options??[];if(!Array.isArray(ps)&&ps&&typeof ps==='object')ps=Object.entries(ps).map(([name,probability])=>({name,probability}));if(mode==='noul'&&ps.length===0&&r.probability!=null)ps=[{name:'成立概率',probability:r.probability}];document.getElementById('probabilities').innerHTML=ps.map(p=>{const name=p.name??p.label??p.choice??'结果',n=pct(p.probability??p.prob??p.p);return `<div class="row"><span>${esc(name)}</span><strong>${n===null?'—':n.toFixed(1)+'%'}</strong></div><div class="bar"><span style="width:${n??0}%"></span></div>`}).join('');const usage=data.usage||{},key=data.key_usage||{},confidence=pct(r.confidence);document.getElementById('metrics').innerHTML=metric('Confidence',confidence===null?'此模式不单独提供':confidence.toFixed(1)+'%')+metric('Input tokens',usage.input_tokens??usage.prompt_tokens)+metric('Output tokens',usage.output_tokens??usage.completion_tokens)+metric('本次 cost',data.cost!=null?'$'+Number(data.cost).toFixed(6):'暂未提供')+metric('当前 Key usage',key.usage==null?'暂未提供':'$'+Number(key.usage).toFixed(6))+metric('Key 剩余额度',data.key_usage==null?'暂时无法读取':key.limit_remaining==null?'此 Key 未设置独立消费上限':'$'+Number(key.limit_remaining).toFixed(6))+metric('剩余额度百分比',data.key_usage==null?'暂时无法读取':key.limit==null||key.limit_remaining==null?'未设置独立上限，无法计算':Number(key.limit)>0&&Number.isFinite(Number(key.limit_remaining))?Math.max(0,Math.min(100,Number(key.limit_remaining)/Number(key.limit)*100)).toFixed(1)+'%':'上限为 0，无法计算');let estimate='';if(key.limit_remaining!=null&&Number(data.cost)>0)estimate=`按本次消耗估算，约可再调用 ${Math.floor(key.limit_remaining/data.cost)} 次；实际消耗会变化。`;document.getElementById('estimate').textContent=estimate;result.classList.remove('hidden');result.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lastRaw);document.getElementById('copy').textContent='已复制'}catch{document.getElementById('copy').textContent='复制失败'}};async function checkSession(){try{let r=await fetch('/api/session',{credentials:'same-origin'});if(r.ok){document.getElementById('login').classList.add('hidden');document.getElementById('workspace').classList.remove('hidden')}}catch{}}document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();let b=e.currentTarget.querySelector('button'),v=document.getElementById('access').value; b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})});if(!r.ok)throw Error(r.status===429?'尝试太频繁，请稍后再试。':'口令不正确，请重试。');document.getElementById('access').value='';await checkSession()}catch(ex){const x=document.getElementById('login-error');x.textContent=ex.message;x.classList.remove('hidden')}finally{b.disabled=false}};checkSession();form.onsubmit=async e=>{e.preventDefault();if(busy)return;const cfg=config[mode],payload={mode,question:text(fields,'question'),context:text(fields,'context')};if(cfg.item){payload.items=[...document.querySelectorAll('#items .item')].map(el=>({name:text(el,'name'),[mode==='choice'?'criteria':'meaning']:text(el,mode==='choice'?'criteria':'meaning')}));if(payload.items.length<cfg.min||payload.items.length>cfg.max||payload.items.some(x=>!x.name)){err.textContent=`请填写 ${cfg.min}～${cfg.max} 个${cfg.word}名称。`;err.classList.remove('hidden');return}}else Object.assign(payload,{support:text(fields,'support'),against:text(fields,'against'),uncertainty:text(fields,'uncertainty')});if(JSON.stringify(payload).length>14000){err.textContent='输入太长，请精简后重试。';err.classList.remove('hidden');return}busy=true;err.classList.add('hidden');let btn=document.getElementById('submit');btn.disabled=true;btn.textContent='正在判断，请稍候…';try{const response=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error(response.status===401?'登录已过期，请刷新页面重新解锁。':response.status===429?'请求过于频繁，请稍后重试。':response.status===404?'服务端接口尚未接入，当前页面暂不能提交。':'暂时无法完成判断，请稍后重试。');display(await response.json())}catch(ex){err.textContent=ex instanceof TypeError?'连接失败，请检查网络后重试。':ex.message;err.classList.remove('hidden')}finally{busy=false;btn.disabled=false;btn.textContent='开始判断'}};
</script></body></html>
