<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2n — Core 几何比较</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f2eb;color:#172c29;font:14px Arial,'PingFang SC',sans-serif}header{padding:26px 5vw;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1100px;margin:auto;padding:10px 5vw}h1{font-weight:500;font-size:40px;letter-spacing:-.04em;margin:20px 0}p{line-height:1.8;max-width:690px;color:#4d655b}#study-view{height:53svh;width:100%;border:1px solid #d1dbd0;background:#e7ece2}#study-view svg{background:transparent!important}button{border:1px solid #859e8f;background:transparent;color:inherit;padding:10px 17px;cursor:pointer;margin:3px;font:inherit}button[aria-pressed=true]{background:#203e31;color:white}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:20px 0}label{display:flex;align-items:center;gap:12px}output{font:11px monospace}.decision{border-top:1px solid #ccd5c8;padding-top:12px;font-size:12px}@media(max-width:600px){h1{font-size:30px}#study-view{height:48svh}.controls{gap:8px}button{padding:8px 10px;font-size:12px}}</style><script type="module" src="study.js"></script></head><body><header><a href="index.html">← 返回叙事实验</a><span>GEOMETRY STUDY / 02</span></header><main><h1>从字形，变成结构。</h1><p>A 是 Visual Prototype 02 的连续曲面雕塑：2 与上标 n 由六个稳定构件连接，结构缝、内部脊柱和节点可以精确展开。B 保留 Prototype 01 的三层带状结构，用于对照视觉跃迁。</p><div id="study-view" aria-label="Core 三维几何展示"></div><div class="controls"><div><button data-variant="A" aria-pressed="true">A · 连接雕塑</button><button data-variant="B" aria-pressed="false">B · 旧版结构</button></div><div><button data-angle="-30">−30°</button><button data-angle="0">正面</button><button data-angle="30">＋30°</button><button data-angle="75">侧面</button></div><label>展开<input id="expansion" type="range" min="0" max="1" step=".01" value="0"></label></div><output id="study-status">准备实际几何</output><p class="decision">主原型采用 A：圆形截面和连续法线建立重量与曲率；正面保持 2ⁿ，轻微侧视可读出深度。它不依赖字体挤压、透明玻璃或后期特效。</p></main></body></html>
