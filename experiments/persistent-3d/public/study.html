<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2n — Core 几何比较</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f2eb;color:#172c29;font:14px Arial,'PingFang SC',sans-serif}header{padding:26px 5vw;display:flex;justify-content:space-between}a{color:inherit}main{max-width:1100px;margin:auto;padding:10px 5vw}h1{font-weight:500;font-size:40px;letter-spacing:-.04em;margin:20px 0}p{line-height:1.8;max-width:650px;color:#4d655b}#study-view{height:53svh;width:100%;border:1px solid #d1dbd0;background:#e7ece2}#study-view svg{background:transparent!important}button{border:1px solid #859e8f;background:transparent;color:inherit;padding:10px 17px;cursor:pointer;margin:3px;font:inherit}button[aria-pressed=true]{background:#203e31;color:white}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;padding:20px 0}label{display:flex;align-items:center;gap:12px}output{font:11px monospace}.decision{border-top:1px solid #ccd5c8;padding-top:12px;font-size:12px}@media(max-width:600px){h1{font-size:30px}#study-view{height:48svh}.controls{gap:8px}button{padding:8px 10px;font-size:12px}}</style><script type="module" src="study.js"></script></head><body><header><a href="index.html">← 返回叙事实验</a><span>GEOMETRY STUDY / 01</span></header><main><h1>同一标识，两种结构。</h1><p>实际几何、多角度与拆解比较。A：有完整剪影的分层实体。B：双带状骨架。主原型选择 A；这里保留 B，方便核查选择依据。</p><div id="study-view" aria-label="Core 三维几何展示"></div><div class="controls"><div><button data-variant="A" aria-pressed="true">A · 分层实体</button><button data-variant="B" aria-pressed="false">B · 带状骨架</button></div><div><button data-angle="-30">−30°</button><button data-angle="0">正面</button><button data-angle="30">＋30°</button><button data-angle="75">侧面</button></div><label>展开<input id="expansion" type="range" min="0" max="1" step=".01" value="0"></label></div><output id="study-status">准备实际几何</output><p class="decision">选择 A：完整的 2ⁿ 剪影更接近现有品牌，层间连接可展开，正面不会变成线圈。没有使用字体包、贴图字或图片序列冒充模型。观察者辨识度评审仍待验证。</p></main></body></html>
